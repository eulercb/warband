name: CI

# Run the full quality suite on every push to main and on every pull request.
# `workflow_dispatch` allows manual runs from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest run per ref needs to finish; cancel superseded in-progress
# runs to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only needs to check out and validate the code.
permissions:
  contents: read

jobs:
  # Static analysis, unit tests and the production build. These gates are fast
  # and gate every change.
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier)
        # Blocking gate: the tree is fully formatted. Run `npm run format`
        # locally to fix any drift (see .prettierignore for excluded paths).
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test + coverage (Vitest)
        # Runs the unit suite and enforces the coverage thresholds configured in
        # vite.config.ts; fails the build if coverage regresses below them.
        run: npm run test:coverage

      - name: Build (tsc + Vite)
        run: npm run build

  # Headless end-to-end smoke test: build, serve the bundle and drive a solo
  # host fight through the real app in Chromium. Kept in its own job so the
  # browser download and any runtime flakiness are isolated from the fast gates.
  smoke:
    name: Smoke (headless browser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        # Installs the exact Chromium build pinned by playwright-core, so
        # chromium.executablePath() below resolves to it.
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run desktop and mobile smoke tests
        run: |
          # Collect the smoke screenshots somewhere we can upload on failure.
          # ($RUNNER_TEMP is always exported to step shells; the `runner`
          # context is not available in job-level `env:`.)
          export SHOT_DIR="$RUNNER_TEMP/smoke-shots"
          mkdir -p "$SHOT_DIR"
          # Serve the production build in the background (vite preview -> :4173).
          npm run preview &
          PREVIEW_PID=$!
          # Wait for the preview server to start accepting connections.
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          # Point the smoke runner at the Chromium we just installed.
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export CHROMIUM_PATH
          set +e
          node scripts/run-smoke.mjs smoke
          code=$?
          if [ "$code" -eq 0 ]; then
            node scripts/run-smoke.mjs smoke:mobile
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/run-smoke.mjs smoke:spells
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/run-smoke.mjs smoke:support
            code=$?
          fi
          set -e
          kill "$PREVIEW_PID" 2>/dev/null || true
          exit $code

      - name: Room guides and touch interactions
        run: |
          export SHOT_DIR="$RUNNER_TEMP/smoke-shots"
          CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          export CHROMIUM_PATH
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort &
          REWARD_DEV_PID=$!
          trap 'kill "$REWARD_DEV_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          node scripts/run-smoke.mjs smoke:rewards
          node scripts/run-smoke.mjs smoke:rooms
          node scripts/run-smoke.mjs smoke:enemy-debuffs
          node scripts/run-smoke.mjs smoke:companions
          node scripts/run-smoke.mjs smoke:moon-form
          node scripts/run-smoke.mjs smoke:coherence

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore

  # Keep all passive loadouts covered without a long serial browser job.
  passive-smoke:
    name: Subclass passives (${{ matrix.cohort }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: pilot
            names: "Death's Opening,Spellblade,Soul Ember,Dread Insight"
          - cohort: casters
            names: 'Arcane Cadence,Binding Ward,Surge Ascent,Spell Weave,Rallying Chorus,Echoed Refrain'
          - cohort: support
            names: 'Victorious Reprise,Tactical Opening,Refulgence,Abundance,Oath Anchor,Relentless Procession'
          - cohort: final
            names: 'Rampage,Spirit Shelter,Flowguard,Shadow Rhythm,Exposed Quarry,Living Paths,Pack Bond,Moon Aspect'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - name: Passive keyboard and touch loadouts
        env:
          SMOKE_PASSIVE_NAMES: ${{ matrix.names }}
        run: |
          export SHOT_DIR="$RUNNER_TEMP/passive-shots"
          mkdir -p "$SHOT_DIR"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run preview &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/run-smoke.mjs smoke:passives
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passive-${{ matrix.cohort }}-screenshots
          path: ${{ runner.temp }}/passive-shots
          if-no-files-found: ignore

  # Run martial and absorption scenarios alongside the existing browser suite,
  # rather than extending its already long serial class/subclass selection loop.
  martial-smoke:
    name: Martial classes (desktop and touch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Martial keyboard and touch casting
        run: |
          export SHOT_DIR="$RUNNER_TEMP/martial-shots"
          mkdir -p "$SHOT_DIR"
          npm run preview &
          MARTIAL_PREVIEW_PID=$!
          trap 'kill "$MARTIAL_PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/run-smoke.mjs smoke:martial
          node scripts/run-smoke.mjs smoke:absorption
          node scripts/run-smoke.mjs smoke:auras
      - name: Upload martial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martial-smoke-screenshots
          path: ${{ runner.temp }}/martial-shots
          if-no-files-found: ignore

  caster-defense-smoke:
    name: Caster defense (desktop and touch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Caster defense keyboard and touch casting
        run: |
          export SHOT_DIR="$RUNNER_TEMP/caster-shots"
          mkdir -p "$SHOT_DIR"
          npm run preview &
          CASTER_PREVIEW_PID=$!
          trap 'kill "$CASTER_PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/run-smoke.mjs smoke:caster-defense
      - name: Upload caster screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caster-defense-screenshots
          path: ${{ runner.temp }}/caster-shots
          if-no-files-found: ignore

  defensive-identity-smoke:
    name: Defense and recovery (${{ matrix.cohort }})
    strategy:
      fail-fast: false
      matrix:
        cohort: [first, remaining]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Defensive identity keyboard and touch casting
        run: |
          export SHOT_DIR="$RUNNER_TEMP/defense-shots"
          mkdir -p "$SHOT_DIR"
          npm run preview &
          DEFENSE_PREVIEW_PID=$!
          trap 'kill "$DEFENSE_PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/run-smoke.mjs ${{ matrix.cohort == 'first' && 'smoke:defensive-identity' || 'smoke:defense-recovery' }}
      - name: Upload caster screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defensive-identity-${{ matrix.cohort }}-screenshots
          path: ${{ runner.temp }}/defense-shots
          if-no-files-found: ignore
